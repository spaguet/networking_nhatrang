<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Портфолио — Место Встречи</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: #000;
      min-height: 100vh;
      font-family: 'Onest', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    .page-header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: max(14px, env(safe-area-inset-top)) 16px 12px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.95) 75%, transparent);
      text-align: center;
    }

    .page-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.9);
      line-height: 1.3;
    }

    .page-subtitle {
      margin-top: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.38);
    }

    .feed {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 8px 16px max(24px, env(safe-area-inset-bottom));
      max-width: 720px;
      margin: 0 auto;
    }

    @media (min-width: 480px) {
      .feed { gap: 20px; padding: 8px 20px 32px; }
    }

    .feed img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
    }

    .status {
      text-align: center;
      padding: 48px 20px;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.55);
      line-height: 1.5;
    }

    .status.err { color: rgba(255, 120, 120, 0.85); }

    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 12px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-top-color: rgba(255, 255, 255, 0.75);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header class="page-header">
    <h1 class="page-title" id="pageTitle">Портфолио</h1>
    <p class="page-subtitle">Просмотр для модерации</p>
  </header>

  <div id="status" class="status">
    <div class="spinner"></div>
    Загрузка…
  </div>
  <div id="feed" class="feed" hidden></div>

  <script>
    var API_URL       = 'https://tg-networking-nhatrang.albertkoall.workers.dev';
    var WEBAPP_SECRET = 'getting_more_money';

    var tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    function esc(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showError(msg) {
      var statusEl = document.getElementById('status');
      statusEl.className = 'status err';
      statusEl.innerHTML = esc(msg);
      document.getElementById('feed').hidden = true;
    }

    function loadPortfolio() {
      var params = new URLSearchParams(window.location.search);
      var listingId = (params.get('listing_id') || '').trim();
      var view = (params.get('view') || '').trim();
      var token = (params.get('token') || '').trim();
      var exp = (params.get('exp') || '').trim();

      if (!listingId) {
        showError('Не указан listing_id');
        return;
      }

      if (view !== 'admin' || !token || !exp) {
        showError('Недостаточно параметров для просмотра');
        return;
      }

      var payload = {
        action: 'get_portfolio',
        listing_id: listingId,
        view: 'admin',
        token: token,
        exp: exp,
        secret: WEBAPP_SECRET
      };

      fetch(API_URL + '/api', {
        method: 'POST',
        body: JSON.stringify(payload)
      })
        .then(function (r) { return r.text(); })
        .then(function (t) {
          var data;
          try {
            data = JSON.parse(t);
          } catch (e) {
            showError('Сервер вернул некорректный ответ');
            return;
          }

          if (!data.ok) {
            showError(data.message || data.error || 'Не удалось загрузить портфолио');
            return;
          }

          var title = data.display_name || 'Портфолио';
          document.getElementById('pageTitle').textContent = title;
          document.title = title + ' — Портфолио';

          var items = (data.items || []).slice().sort(function (a, b) {
            return (a.position || 0) - (b.position || 0);
          });

          var statusEl = document.getElementById('status');
          var feedEl = document.getElementById('feed');

          if (!items.length) {
            statusEl.className = 'status';
            statusEl.textContent = 'Нет фото';
            feedEl.hidden = true;
            return;
          }

          statusEl.hidden = true;
          feedEl.hidden = false;
          feedEl.innerHTML = '';

          items.forEach(function (item) {
            var img = document.createElement('img');
            img.src = item.url;
            img.alt = '';
            img.loading = 'lazy';
            if (item.width) img.width = item.width;
            if (item.height) img.height = item.height;
            feedEl.appendChild(img);
          });
        })
        .catch(function () {
          showError('Не удалось загрузить. Проверьте интернет.');
        });
    }

    loadPortfolio();
  </script>
</body>
</html>
