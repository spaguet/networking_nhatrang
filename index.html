<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Нетворкинг Нячанг</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #f4f6f8);
      --text: var(--tg-theme-text-color, #1a1a1a);
      --hint: var(--tg-theme-hint-color, #6b7280);
      --btn: var(--tg-theme-button-color, #2aabee);
      --btn-text: var(--tg-theme-button-text-color, #fff);
      --secondary: var(--tg-theme-secondary-bg-color, #fff);
      --border: rgba(0, 0, 0, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px 16px 32px;
      min-height: 100vh;
    }
    h1 {
      font-size: 1.35rem;
      margin: 0 0 6px;
      font-weight: 700;
    }
    .subtitle {
      color: var(--hint);
      font-size: 0.9rem;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .card {
      background: var(--secondary);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    input, select, textarea {
      width: 100%;
      font-size: 1rem;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
    }
    textarea { min-height: 120px; resize: vertical; }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid var(--btn);
      outline-offset: 0;
    }
    .hint {
      font-size: 0.78rem;
      color: var(--hint);
      margin-top: 6px;
    }
    button[type="submit"] {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: var(--btn);
      color: var(--btn-text);
      cursor: pointer;
      margin-top: 8px;
    }
    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      display: none;
    }
    .status.ok { display: block; background: #d1fae5; color: #065f46; }
    .status.err { display: block; background: #fee2e2; color: #991b1b; }
    .status.info { display: block; background: #dbeafe; color: #1e40af; }
    .outside {
      text-align: center;
      padding: 40px 20px;
      color: var(--hint);
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>Анкета специалиста</h1>
    <p class="subtitle">Нетворкинг Нячанг — разместите профиль в каталоге. Только анкеты специалистов, не вакансии.</p>

    <div id="listingInfo" class="status info" role="status" hidden></div>

    <form id="listingForm">
      <div class="card">
        <label for="display_name">Имя для каталога</label>
        <input id="display_name" name="display_name" required maxlength="80" placeholder="Как вас показывать в витрине" />

        <label for="category" style="margin-top:14px">Категория</label>
        <select id="category" name="category" required></select>

        <label for="description" style="margin-top:14px">Описание</label>
        <textarea id="description" name="description" required maxlength="2000" placeholder="Специализация, опыт, чем можете быть полезны"></textarea>
        <p class="hint">Без запрещённого контента и объявлений о найме сотрудников.</p>

        <label for="contacts" style="margin-top:14px">Контакты</label>
        <input id="contacts" name="contacts" required maxlength="500" placeholder="Telegram, email, WhatsApp" />
      </div>

      <button type="submit" id="submitBtn">Отправить на модерацию</button>
      <div id="status" class="status" role="alert"></div>
    </form>
  </div>

  <div id="outside" class="outside" hidden>
    Откройте эту страницу через Telegram-бота (Mini App).
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwVAGa_BKyprhGRyF8mxbM_mimURSeVNnqMKI_lUqx_TAaCGBeWiK9cmC5b0ULyvdnZ/exec';
    const WEBAPP_SECRET = 'getting_more_money';

    const CATEGORIES = [
      'IT и разработка',
      'Дизайн и creative',
      'Маркетинг и SMM',
      'Бизнес и финансы',
      'Юриспруденция',
      'Медицина и здоровье',
      'Красота и уход',
      'Туризм и экскурсии',
      'Образование и репетиторство',
      'Строительство и ремонт',
      'Транспорт и логистика',
      'Другое'
    ];

    const ERRORS = {
      stop_words: 'Текст содержит запрещённые слова. Измените описание.',
      duplicate: 'У вас уже есть анкета на модерации или в каталоге.',
      duplicate_active: 'У вас уже есть опубликованная анкета в каталоге.',
      duplicate_moderation: 'Анкета уже на модерации — дождитесь решения в чате с ботом.',
      duplicate_pending_payment: 'Анкета ожидает оплату — проверьте сообщения от бота.',
      Invalid_initData: 'Ошибка авторизации Telegram. Перезапустите Mini App.',
      invalid_category: 'Выберите категорию из списка.',
      validation: 'Заполните все поля.',
      invalid_secret: 'Ошибка конфигурации приложения.',
      server_error: 'Сервер временно недоступен. Попробуйте позже.'
    };

    const tg = window.Telegram?.WebApp;
    const appEl = document.getElementById('app');
    const outsideEl = document.getElementById('outside');
    const form = document.getElementById('listingForm');
    const categorySelect = document.getElementById('category');
    const statusEl = document.getElementById('status');
    const listingInfoEl = document.getElementById('listingInfo');
    const submitBtn = document.getElementById('submitBtn');
    let submitBlocked = false;

    CATEGORIES.forEach(function (c) {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (!tg || !tg.initData) {
      appEl.hidden = true;
      outsideEl.hidden = false;
    } else {
      tg.ready();
      tg.expand();
      const user = tg.initDataUnsafe?.user;
      if (user?.first_name) {
        const nameInput = document.getElementById('display_name');
        if (!nameInput.value) {
          nameInput.value = user.first_name;
        }
      }
      checkListingStatus();
    }

    function showStatus(text, isError) {
      statusEl.textContent = text;
      statusEl.className = 'status ' + (isError ? 'err' : 'ok');
    }

    function setSubmitBlocked(blocked, infoText) {
      submitBlocked = blocked;
      submitBtn.disabled = blocked;
      if (infoText) {
        listingInfoEl.textContent = infoText;
        listingInfoEl.hidden = false;
      } else {
        listingInfoEl.hidden = true;
      }
    }

    function buildPayload(action) {
      const user = tg.initDataUnsafe.user;
      const payload = {
        action: action,
        tg_id: user.id,
        username: user.username || '',
        first_name: user.first_name || '',
        initData: tg.initData
      };
      if (WEBAPP_SECRET) {
        payload.secret = WEBAPP_SECRET;
      }
      return payload;
    }

    async function checkListingStatus() {
      if (!tg?.initData) {
        return;
      }
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify(buildPayload('check_listing_status'))
        });
        const data = JSON.parse(await res.text());
        if (data.ok && data.has_listing && data.can_submit === false) {
          setSubmitBlocked(true, data.message || ERRORS[data.error] || ERRORS.duplicate);
        }
      } catch (err) {
        // Тихо игнорируем — форма покажет ошибку при отправке
      }
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      if (!tg?.initData) return;
      if (submitBlocked) {
        showStatus(listingInfoEl.textContent || ERRORS.duplicate, true);
        return;
      }

      const user = tg.initDataUnsafe.user;
      submitBtn.disabled = true;
      statusEl.className = 'status';

      const payload = {
        action: 'submit_listing',
        tg_id: user.id,
        username: user.username || '',
        first_name: user.first_name || '',
        display_name: form.display_name.value.trim(),
        category: form.category.value,
        description: form.description.value.trim(),
        contacts: form.contacts.value.trim(),
        initData: tg.initData
      };
      if (WEBAPP_SECRET) {
        payload.secret = WEBAPP_SECRET;
      }

      try {
        // Без Content-Type: application/json — иначе браузер шлёт OPTIONS preflight,
        // а GAS на него отвечает 405 и fetch падает с CORS.
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch (parseErr) {
          showStatus(
            'Сервер вернул не JSON (часто устаревший GAS_URL). Обновите URL деплоя /exec в index.html.',
            true
          );
          return;
        }

        if (data.ok) {
          showStatus(data.message || 'Анкета отправлена на модерацию', false);
          form.reset();
          tg.close?.();
        } else {
          const key = (data.error || '').replace(/\s/g, '_');
          const text = data.message || ERRORS[key] || data.error || 'Ошибка отправки';
          showStatus(text, true);
          if (key.indexOf('duplicate_') === 0) {
            setSubmitBlocked(true, text);
          }
        }
      } catch (err) {
        showStatus(
          'Не удалось отправить. Проверьте GAS_URL (URL деплоя GAS /exec) и интернет.',
          true
        );
      } finally {
        if (!submitBlocked) {
          submitBtn.disabled = false;
        }
      }
    });
  </script>
</body>
</html>
