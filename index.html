<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Нетворкинг Нячанг</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #f4f6f8);
      --text: var(--tg-theme-text-color, #1a1a1a);
      --hint: var(--tg-theme-hint-color, #6b7280);
      --btn: var(--tg-theme-button-color, #2aabee);
      --btn-text: var(--tg-theme-button-text-color, #fff);
      --secondary: var(--tg-theme-secondary-bg-color, #fff);
      --border: rgba(0, 0, 0, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px 16px 32px;
      min-height: 100vh;
    }
    h1 {
      font-size: 1.35rem;
      margin: 0 0 6px;
      font-weight: 700;
    }
    h2 {
      font-size: 1.1rem;
      margin: 0 0 16px;
      font-weight: 600;
    }
    .subtitle {
      color: var(--hint);
      font-size: 0.9rem;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .card {
      background: var(--secondary);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    input, select, textarea {
      width: 100%;
      font-size: 1rem;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
    }
    textarea { min-height: 120px; resize: vertical; }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid var(--btn);
      outline-offset: 0;
    }
    .hint {
      font-size: 0.78rem;
      color: var(--hint);
      margin-top: 6px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 8px;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--btn);
      color: var(--btn-text);
    }
    .btn-secondary {
      background: var(--secondary);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    .status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      display: none;
      line-height: 1.45;
    }
    .status.ok { display: block; background: #d1fae5; color: #065f46; }
    .status.err { display: block; background: #fee2e2; color: #991b1b; }
    .status.info { display: block; background: #dbeafe; color: #1e40af; }
    .outside {
      text-align: center;
      padding: 40px 20px;
      color: var(--hint);
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="app">
    <div id="screenForm">
      <h1>Анкета специалиста</h1>
      <p class="subtitle">Нетворкинг Нячанг — разместите профиль в каталоге. Только анкеты специалистов, не вакансии.</p>

      <div id="listingInfo" class="status info" role="status" hidden></div>

      <form id="listingForm">
        <div class="card">
          <label for="display_name">Имя для каталога</label>
          <input id="display_name" name="display_name" required maxlength="80" placeholder="Как вас показывать в витрине" />

          <label for="category" style="margin-top:14px">Категория</label>
          <select id="category" name="category" required></select>

          <label for="description" style="margin-top:14px">Описание</label>
          <textarea id="description" name="description" required maxlength="2000" placeholder="Специализация, опыт, чем можете быть полезны"></textarea>
          <p class="hint">Без запрещённого контента и объявлений о найме сотрудников.</p>

          <label for="contacts" style="margin-top:14px">Контакты</label>
          <input id="contacts" name="contacts" required maxlength="500" placeholder="Telegram, email, WhatsApp" />
        </div>

        <div id="freeActions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Отправить на модерацию</button>
        </div>
        <div id="paidActions" class="btn-row" hidden>
          <button type="button" class="btn btn-primary" id="paidBtn">Разместить платно</button>
          <button type="button" class="btn btn-secondary" id="cancelBtn">Отмена</button>
        </div>
        <div id="status" class="status" role="alert"></div>
      </form>
    </div>

    <div id="screenPayment" hidden>
      <h1>Оплата размещения</h1>
      <h2>Выберите способ оплаты</h2>
      <div class="btn-row">
        <button type="button" class="btn btn-primary pay-method" data-method="vnd">VND по QR</button>
        <button type="button" class="btn btn-primary pay-method" data-method="bybit">USDT Tether (Bybit)</button>
        <button type="button" class="btn btn-primary pay-method" data-method="trc20">USDT TRC20</button>
        <button type="button" class="btn btn-primary pay-method" data-method="solana">USDT Solana</button>
        <button type="button" class="btn btn-secondary" id="backBtn">Назад</button>
      </div>
      <div id="paymentStatus" class="status" role="alert"></div>
    </div>
  </div>

  <div id="outside" class="outside" hidden>
    Откройте эту страницу через Telegram-бота (Mini App).
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwVAGa_BKyprhGRyF8mxbM_mimURSeVNnqMKI_lUqx_TAaCGBeWiK9cmC5b0ULyvdnZ/exec';
    const WEBAPP_SECRET = 'getting_more_money';

    const CATEGORIES = [
      'IT и разработка',
      'Дизайн и creative',
      'Маркетинг и SMM',
      'Бизнес и финансы',
      'Юриспруденция',
      'Медицина и здоровье',
      'Красота и уход',
      'Туризм и экскурсии',
      'Образование и репетиторство',
      'Строительство и ремонт',
      'Транспорт и логистика',
      'Другое'
    ];

    const ERRORS = {
      stop_words: 'Текст содержит запрещённые слова. Измените описание.',
      use_paid_flow: 'Используйте платное размещение.',
      Invalid_initData: 'Ошибка авторизации Telegram. Перезапустите Mini App.',
      invalid_category: 'Выберите категорию из списка.',
      validation: 'Заполните все поля.',
      invalid_secret: 'Ошибка конфигурации приложения.',
      invalid_payment_method: 'Выберите способ оплаты.',
      qr_not_configured: 'QR для этого способа ещё не настроен.',
      server_error: 'Сервер временно недоступен. Попробуйте позже.'
    };

    const tg = window.Telegram?.WebApp;
    const appEl = document.getElementById('app');
    const outsideEl = document.getElementById('outside');
    const screenForm = document.getElementById('screenForm');
    const screenPayment = document.getElementById('screenPayment');
    const form = document.getElementById('listingForm');
    const categorySelect = document.getElementById('category');
    const statusEl = document.getElementById('status');
    const paymentStatusEl = document.getElementById('paymentStatus');
    const listingInfoEl = document.getElementById('listingInfo');
    const freeActions = document.getElementById('freeActions');
    const paidActions = document.getElementById('paidActions');
    const submitBtn = document.getElementById('submitBtn');
    const paidBtn = document.getElementById('paidBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const backBtn = document.getElementById('backBtn');

    let appMode = 'free';

    CATEGORIES.forEach(function (c) {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    function showStatus(el, text, type) {
      el.textContent = text;
      el.className = 'status ' + type;
    }

    function clearStatus(el) {
      el.className = 'status';
      el.textContent = '';
    }

    function setMode(mode, banner) {
      appMode = mode;
      if (mode === 'paid') {
        freeActions.hidden = true;
        paidActions.hidden = false;
        submitBtn.disabled = false;
        if (banner) {
          listingInfoEl.textContent = banner;
          listingInfoEl.hidden = false;
        }
      } else {
        freeActions.hidden = false;
        paidActions.hidden = true;
        listingInfoEl.hidden = true;
      }
    }

    function buildPayload(action, extra) {
      const user = tg.initDataUnsafe.user;
      const payload = Object.assign(
        {
          action: action,
          tg_id: user.id,
          username: user.username || '',
          first_name: user.first_name || '',
          initData: tg.initData
        },
        extra || {}
      );
      if (WEBAPP_SECRET) {
        payload.secret = WEBAPP_SECRET;
      }
      return payload;
    }

    function getFormData() {
      return {
        display_name: form.display_name.value.trim(),
        category: form.category.value,
        description: form.description.value.trim(),
        contacts: form.contacts.value.trim()
      };
    }

    function validateFormClient() {
      const data = getFormData();
      if (!data.display_name || !data.category || !data.description || !data.contacts) {
        showStatus(statusEl, ERRORS.validation, 'err');
        return null;
      }
      return data;
    }

    async function apiPost(payload) {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch (parseErr) {
        throw new Error('not_json');
      }
    }

    async function checkListingStatus() {
      if (!tg?.initData) {
        return;
      }
      try {
        const data = await apiPost(buildPayload('check_listing_status'));
        if (data.ok && data.paid_mode) {
          setMode('paid', data.banner);
        } else {
          setMode('free');
        }
      } catch (err) {
        // форма всё равно попробует отправить
      }
    }

    if (!tg || !tg.initData) {
      appEl.hidden = true;
      outsideEl.hidden = false;
    } else {
      tg.ready();
      tg.expand();
      (function () {
        var params = new URLSearchParams(window.location.search);
        if (params.get('prefill') !== '1') return;
      
        var nameVal     = params.get('name')     || '';
        var catVal      = params.get('cat')      || '';
        var descVal     = params.get('desc')     || '';
        var contactsVal = params.get('contacts') || '';
      
        if (nameVal)     document.getElementById('display_name').value = nameVal;
        if (descVal)     document.getElementById('description').value  = descVal;
        if (contactsVal) document.getElementById('contacts').value     = contactsVal;
      
        // Выбрать нужную категорию в select
        if (catVal) {
          var sel = document.getElementById('category');
          for (var i = 0; i < sel.options.length; i++) {
            if (sel.options[i].value === catVal) {
              sel.selectedIndex = i;
              break;
            }
          }
        }
      })();
      const user = tg.initDataUnsafe?.user;
      if (user?.first_name) {
        const nameInput = document.getElementById('display_name');
        if (!nameInput.value) {
          nameInput.value = user.first_name;
        }
      }
      checkListingStatus();
    }

    cancelBtn.addEventListener('click', function () {
      tg.close?.();
    });

    backBtn.addEventListener('click', function () {
      screenPayment.hidden = true;
      screenForm.hidden = false;
      clearStatus(paymentStatusEl);
    });

    paidBtn.addEventListener('click', function () {
      if (!validateFormClient()) {
        return;
      }
      clearStatus(statusEl);
      screenForm.hidden = true;
      screenPayment.hidden = false;
      clearStatus(paymentStatusEl);
    });

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      if (!tg?.initData || appMode === 'paid') {
        return;
      }

      const formData = validateFormClient();
      if (!formData) {
        return;
      }

      submitBtn.disabled = true;
      clearStatus(statusEl);

      try {
        const data = await apiPost(buildPayload('submit_listing', formData));
        if (data.ok) {
          showStatus(statusEl, data.message || 'Анкета отправлена на модерацию', 'ok');
          form.reset();
          tg.close?.();
        } else {
          const key = (data.error || '').replace(/\s/g, '_');
          const msg = data.message || ERRORS[key] || data.error || 'Ошибка отправки';
          showStatus(statusEl, msg, 'err');
          if (data.paid_mode || key === 'use_paid_flow') {
            setMode('paid', data.message || msg);
          }
        }
      } catch (err) {
        showStatus(
          statusEl,
          err.message === 'not_json'
            ? 'Сервер вернул не JSON. Обновите URL деплоя GAS /exec в index.html.'
            : 'Не удалось отправить. Проверьте GAS_URL и интернет.',
          'err'
        );
      } finally {
        submitBtn.disabled = false;
      }
    });

    document.querySelectorAll('.pay-method').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        const formData = validateFormClient();
        if (!formData) {
          screenPayment.hidden = true;
          screenForm.hidden = false;
          return;
        }

        const method = btn.getAttribute('data-method');
        btn.disabled = true;
        clearStatus(paymentStatusEl);

        try {
          const data = await apiPost(
            buildPayload('select_payment_method', Object.assign({ payment_method: method }, formData))
          );
          if (data.ok) {
            showStatus(
              paymentStatusEl,
              data.message ||
                'QR-код отправлен в чат с ботом. После оплаты пришлите скриншот чека в ответ боту.',
              'ok'
            );
            setTimeout(function () {
              tg.close?.();
            }, 2500);
          } else {
            const key = (data.error || '').replace(/\s/g, '_');
            showStatus(paymentStatusEl, data.message || ERRORS[key] || 'Ошибка оплаты', 'err');
          }
        } catch (err) {
          showStatus(paymentStatusEl, 'Не удалось отправить запрос. Проверьте интернет.', 'err');
        } finally {
          btn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
