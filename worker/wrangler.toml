name = "tg-networking-nhatrang"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "networking_nhatrang"
database_id = "da3337f2-02ad-49ef-b577-09916aa08763"
migrations_dir = "src/db/migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "aed391de129a4490a3d390731bd9ae90"

# Create bucket once: wrangler r2 bucket create networking-portfolio
[[r2_buckets]]
binding = "PORTFOLIO"
bucket_name = "networking-portfolio"

[triggers]
crons = ["0 0 * * *"]

[vars]
MINI_APP_URL = "https://spaguet.github.io/networking_nhatrang/"
# Public URL of this Worker (from `wrangler deploy` output / custom domain).
# Used to build the one stable /miniapp redirect link for Telegram's
# persistent menu button, so it never needs to be updated by hand again.
WORKER_URL = "https://tg-networking-nhatrang.albertkoall.workers.dev"
